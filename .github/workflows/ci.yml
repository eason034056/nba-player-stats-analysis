name: CI

# Default branch is `master` (this repo has no `main`). `dev` is the integration branch.
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Fatal syntax and undefined-name rules only. The broader E4/E7/E9/F
      # set still has 49 pre-existing findings and is a follow-up.
      - run: pip install ruff==0.17.4
      - run: ruff check . --select E9,F63,F7,F82
      - name: Confirm the backend tree parses
        run: python -m compileall -q .

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novig
          POSTGRES_PASSWORD: novig
          POSTGRES_DB: novig_nba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novig -d novig_nba"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://novig:novig@localhost:5432/novig_nba
      ODDS_API_KEY: test-key
      OPENAI_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest --tb=short -q

  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Tests assert US civil dates. 2026-03-12T00:00:00Z is 2026-03-11 in
      # America/Chicago and 2026-03-12 in UTC, so a UTC runner fails them.
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  walk-forward-guard:
    name: Walk-forward calibration guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            scripts/agents/requirements_agents.txt
      - run: pip install -r backend/requirements.txt -r scripts/agents/requirements_agents.txt
      - run: python -m pytest scripts/agents/tests/test_walk_forward_backtest.py scripts/agents/tests/test_calibration_guard.py scripts/agents/tests/test_spo107_harness_gametype.py -q --tb=short

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
