name: Deploy backend

# workflow_dispatch only. The default branch is master. This repo has no main.
# To also deploy on push to master later, add a push trigger and keep the
# DEPLOY_ENABLED check below:
#
# on:
#   workflow_dispatch:
#   push:
#     branches: [master]
#
# Do not use main. A push filter on main would never run.
#
# Required before this can succeed:
#   repository variable DEPLOY_ENABLED=true
#   repository variable AWS_DEPLOY_ROLE_ARN  (terraform output github_deploy_role_arn)
#   repository variable AWS_REGION=us-east-2
#   repository variable EC2_INSTANCE_ID       (terraform output instance_id)
# The workflow assumes that role with GitHub OIDC. It does not read static AWS keys.
# GITHUB_TOKEN pushes the image to GHCR. The package must be public so the
# instance can pull it without a token. If it stays private, store
# GHCR_PULL_USER and GHCR_PULL_TOKEN in SSM /sportslab/prod/ and remote-up.sh
# logs in without printing the token.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Stop unless deploy is enabled
        run: |
          if [ "${{ vars.DEPLOY_ENABLED }}" != "true" ]; then
            echo "DEPLOY_ENABLED is not true. Refusing to build or deploy."
            echo "Set the repository variable after the OIDC role and instance id exist."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        run: |
          repo=$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${repo}/backend" >> "$GITHUB_ENV"

      - name: Build and push the arm64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy on the instance with SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -eu
          if [ -z "$INSTANCE_ID" ] || [ -z "$AWS_REGION" ]; then
            echo "EC2_INSTANCE_ID and AWS_REGION must be set" >&2
            exit 1
          fi
          script=$(printf '%s\n' \
            "set -eu" \
            "export BACKEND_IMAGE=${IMAGE_NAME}:${IMAGE_TAG}" \
            "repo=/opt/sportslab/repo" \
            "if [ ! -d \"\$repo/.git\" ]; then mkdir -p /opt/sportslab; git clone https://github.com/${{ github.repository }}.git \"\$repo\"; fi" \
            "cd \"\$repo\"" \
            "git fetch --depth 1 origin ${IMAGE_TAG}" \
            "git checkout --detach --force FETCH_HEAD" \
            "deploy/remote-up.sh ${IMAGE_TAG}")
          params=$(jq -n --arg script "$script" '{commands: [$script]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy backend ${IMAGE_TAG}" \
            --parameters "$params" \
            --query "Command.CommandId" \
            --output text)
          echo "command id: $command_id"
          i=0
          while [ "$i" -lt 60 ]; do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text || true)
            case "$status" in
              Success)
                echo "deploy status: Success"
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "deploy status: $status" >&2
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text >&2 || true
                exit 1
                ;;
            esac
            i=$((i + 1))
            sleep 10
          done
          echo "timed out waiting for SSM command $command_id" >&2
          exit 1
