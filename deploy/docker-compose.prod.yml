# Production stack on the EC2 host.
# Caddy is the only published service. Backend and Redis have no host ports.
# The scheduler stays inside the backend process. Do not add --workers.
# Images are pulled from GHCR. The repository is public, so the pull is anonymous
# unless deploy/remote-up.sh finds GHCR_PULL_USER and GHCR_PULL_TOKEN.

services:
  caddy:
    image: caddy:2.8.4-alpine
    container_name: sportslab-caddy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.https:/etc/caddy/Caddyfile.https:ro
      - ./caddy-entrypoint.sh:/usr/local/bin/caddy-entrypoint.sh:ro
      - caddy_data:/data
      - caddy_config:/config
    entrypoint: ["/bin/sh", "/usr/local/bin/caddy-entrypoint.sh"]
    networks:
      sportslab:
        ipv4_address: 172.30.133.10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/eason034056/nba-player-stats-analysis/backend:latest}
    container_name: sportslab-backend
    restart: unless-stopped
    env_file:
      - /etc/sportslab/backend.env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_REQUIRED: "true"
      # Pinned false so an SSM value cannot turn the check on. The frontend
      # in this repo still calls the API from the browser. Flip this to
      # "true" only after Vercel serves Frontend #63 (7c034de).
      PROXY_SECRET_REQUIRED: "false"
    # uvicorn 0.30 matches --forwarded-allow-ips as an exact peer address, not a
    # CIDR. 172.30.133.10 is Caddy. The subnet below is pinned so that address
    # stays on Caddy. Never set this to "*".
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=172.30.133.10
    mem_limit: 1g
    volumes:
      - /opt/sportslab/certs/global-bundle.pem:/app/certs/global-bundle.pem:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - sportslab
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: sportslab-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 100mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sportslab
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  sportslab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.133.0/24

volumes:
  redis_data:
  caddy_data:
  caddy_config:
